[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    kosme/arduinoFFT @ ^2.0.2
    adafruit/Adafruit NeoPixel @ ^1.12.0

; 編譯最佳化
build_flags = 
    -O2
    -DARDUINO_LOOP_STACK_SIZE=16384

; 監控設定
monitor_filters = 
    esp32_exception_decoder
    time

; 上傳速率
upload_speed = 921600

; 硬件配置
board_build.flash_size = 4MB

; ★ 新增：加入 BLE 後 firmware 會變大，預設分割表放不下，
;   改用 huge_app 給 app 更大空間，避免「program size exceeds」編譯失敗。
;   (此分割表無 OTA、無 SPIFFS；本專案的衛教模式不需要，剛好合用)
board_build.partitions = huge_app.csv
