<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>呼吸訓練遊戲廳</title>
<style>
  :root{
    --bg:#43111a; --panel:#5c1a26; --header:#370d14; --track:#2c0910;
    --gold:#ffd24a; --gold-dk:#b8862a; --red:#e6402f; --red-br:#ff6a52;
    --cream:#fff3df; --green:#7fe08d; --blue:#5fb0ff; --dim:#e0b58f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);
    font-family:"Microsoft JhengHei UI","PingFang TC","Noto Sans TC",sans-serif;
    overflow:hidden;overscroll-behavior:none;touch-action:none;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  .bar{background:var(--header);display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap;}
  button{font-family:inherit;border:none;border-radius:10px;cursor:pointer;font-weight:700;
    transition:transform .06s ease, filter .15s ease;}
  button:active{transform:translateY(1px) scale(.99);}
  .btn-gold{background:var(--gold);color:#3a0a10;} .btn-dk{background:var(--panel);color:var(--cream);}
  .btn-red{background:var(--red);color:var(--cream);} .btn-blue{background:var(--blue);color:#0a1a3a;}
  .btn-md{font-size:15px;padding:9px 16px;} .btn-lg{font-size:20px;padding:13px 24px;}
  input{font-family:inherit;background:var(--panel);color:var(--cream);border:none;border-radius:8px;
    padding:8px 10px;font-size:15px;outline:none;}
  #status{font-size:14px;color:var(--dim);} #status.on{color:var(--green);} #status.warn{color:var(--gold);}
  label{font-size:14px;color:var(--dim);}
  .spacer{flex:1;}
  #wrap{flex:1;position:relative;min-height:0;}
  canvas{width:100%;height:100%;display:block;}
  /* 主選單 */
  #hub{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:24px;background:var(--bg);overflow-y:auto;}
  #hub h1{font-size:min(46px,7vw);color:var(--gold);margin:0;}
  #hub p{color:var(--dim);margin:0 0 6px;font-size:16px;}
  .cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:1000px;width:100%;}
  .card{width:280px;min-height:220px;border-radius:18px;padding:22px;cursor:pointer;
    display:flex;flex-direction:column;gap:10px;color:#2a0a10;
    box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .1s ease, box-shadow .1s ease;}
  .card:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .card .big{font-size:30px;font-weight:800;}
  .card .tag{font-size:14px;font-weight:800;opacity:.7;}
  .card .desc{font-size:15px;line-height:1.5;font-weight:600;}
  .c1{background:linear-gradient(160deg,#ffd24a,#ffb03a);}
  .c2{background:linear-gradient(160deg,#8fe0a0,#5fb0ff);}
  .c3{background:linear-gradient(160deg,#ffb0b0,#ff7a6a);}
  #bottom{margin-top:auto;}
  #bottom.hide{display:none;}
  #syncStatus{font-size:12px;color:var(--dim);opacity:.85;}
  #syncStatus.err{color:var(--red-br);}

  /* 觸控吸/吐按鈕（手機試玩用；沒接裝置時出現）*/
  #touchpad{position:absolute;left:0;right:0;bottom:0;display:none;
    padding:12px;gap:12px;justify-content:center;pointer-events:none;}
  #touchpad.show{display:flex;}
  .tbtn{pointer-events:auto;flex:1;max-width:220px;height:74px;border-radius:16px;
    font-size:20px;font-weight:800;color:#2a0a10;box-shadow:0 5px 0 rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;}
  .tbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
  #tInhale{background:linear-gradient(160deg,#ffd24a,#ffb03a);}
  #tExhale{background:linear-gradient(160deg,#ffb0b0,#ff7a6a);}

  /* 手機直式：卡片改為單欄堆疊、頂列緊湊 */
  @media (max-width:720px){
    .bar.top{gap:6px;padding:7px 10px;}
    .bar.top label{display:none;}
    #name{width:88px;}
    #hub{gap:14px;padding:16px;justify-content:flex-start;padding-top:24px;}
    #hub p{font-size:14px;}
    #hub h1{font-size:24px;}
    .cards{gap:12px;flex-direction:column;align-items:center;}
    .card{width:100%;max-width:420px;min-height:0;padding:16px 18px;
      box-shadow:0 4px 0 rgba(0,0,0,.25);}
    .card .big{font-size:22px;}
    .card .desc{font-size:14px;line-height:1.45;}
    .btn-lg{font-size:18px;padding:12px 20px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="bar top">
    <button id="bleBtn" class="btn-blue btn-md">藍芽連線</button>
    <button id="usbBtn" class="btn-gold btn-md">USB 連線</button>
    <span id="status">未連線</span>
    <span class="spacer"></span>
    <span id="syncStatus"></span>
    <label>姓名 / 編號</label>
    <input id="name" maxlength="12" size="8" placeholder="使用者" />
  </div>

  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hub">
      <p>呼吸訓練遊戲廳</p>
      <h1>選一個遊戲開始</h1>
      <div class="cards">
        <div class="card c1" data-game="angrybird">
          <div class="tag">爆發力 · 吸氣</div>
          <div class="big">🐦 吸氣彈弓鳥</div>
          <div class="desc">深吸一口氣蓄力，放開就發射，把小鳥射去撞倒豬堡壘。練最大吸氣流速。</div>
        </div>
        <div class="card c3" data-game="balloon">
          <div class="tag">耐力 · 持久吐氣</div>
          <div class="big">🎈 吹氣球</div>
          <div class="desc">穩穩地把氣持續吐出去，讓氣球越吹越大，撐住就放飛。練持久力。</div>
        </div>
        <div class="card c2" data-game="taiko">
          <div class="tag">節奏 · 吸+吐</div>
          <div class="big">🥁 呼吸太鼓</div>
          <div class="desc">跟著長條吸氣、吐氣，顏色就是指令。整條吹好就是「良」。練呼吸節奏。</div>
        </div>
      </div>
    </div>

    <!-- 觸控試玩按鈕（手機沒接裝置時可用手指玩）-->
    <div id="touchpad">
      <div class="tbtn" id="tInhale">吸氣 ▲</div>
      <div class="tbtn" id="tExhale">吐氣 ▼</div>
    </div>
  </div>

  <div id="bottom" class="bar hide">
    <button id="backBtn" class="btn-dk btn-md">← 返回選單</button>
    <span class="spacer"></span>
    <button id="primary" class="btn-gold btn-lg">開始</button>
  </div>
</div>

<script type="module">
import { analyze, parseFFTLine, status as algoStatus } from "./breath_algorithm.js";
import angrybird from "./game_angrybird.js";
import balloon from "./game_balloon.js";
import taiko from "./game_taiko.js";

const GAMES = { angrybird, balloon, taiko };
const ONSET = 12;

const COLORS = { bg:"#43111a", panel:"#5c1a26", header:"#370d14", track:"#2c0910",
  gold:"#ffd24a", goldDk:"#b8862a", red:"#e6402f", redBr:"#ff6a52",
  cream:"#fff3df", green:"#7fe08d", blue:"#5fb0ff", dim:"#e0b58f" };

// ================= 雲端上傳 =================
const LOG_ENDPOINT = "/api/log";
function setSyncStatus(text, isErr=false){ syncStatusEl.textContent = text; syncStatusEl.className = isErr ? "err" : ""; }
async function uploadLog(payload){
  try{
    const res = await fetch(LOG_ENDPOINT, { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name: api.name(), ts: Date.now(), deviceId: deviceId, ...payload }) });
    if(!res.ok) throw new Error("HTTP " + res.status);
    setSyncStatus("☁ 已同步");
  }catch(err){ console.warn("上傳失敗(不影響遊戲):", err); setSyncStatus("☁ 同步失敗，稍後重試", true); }
}

// ---------- 儲存 ----------
const mem = {};
const store = {
  get(k, def=null){ try{ const v=localStorage.getItem("bt_"+k); return v==null?def:JSON.parse(v); }
    catch{ return (k in mem)?mem[k]:def; } },
  set(k, v){ try{ localStorage.setItem("bt_"+k, JSON.stringify(v)); }catch{ mem[k]=v; }
    uploadLog({ type:"score", game: current ? currentId : null, key:k, value:v }); },
};

// ================= 輸入來源（USB serial / BLE / 觸控）=================
// 三種來源都把最新的 FFT 存進 lastFFT，下游 analyze() 完全一致。
let lastFFT=null, lastTs=0, deviceId=null;
function onFFTLine(ln){
  // 若行首帶 [ID:xxxxxx]，解析出裝置 ID（韌體會在每行 FFT 前面加）
  const m = ln.match(/^\[ID:([0-9A-Fa-f]+)\]/);
  if(m) deviceId = m[1];
  const b=parseFFTLine(ln); if(b){ lastFFT=b; lastTs=performance.now()/1000; }
}

// ---- USB (Web Serial) ----
let port=null, reader=null, keepReadingSerial=false;
async function connectSerial(){
  if(port){ await disconnectSerial(); return; }
  if(!("serial" in navigator)){ setStatus("此裝置不支援 USB(Web Serial)，手機請改用藍芽","warn"); return; }
  try{ port=await navigator.serial.requestPort(); await port.open({baudRate:115200}); }
  catch{ setStatus("未選擇 USB 裝置","warn"); port=null; return; }
  usbBtn.textContent="USB 斷線"; setStatus("USB 已連線","on"); keepReadingSerial=true; serialLoop();
  uploadLog({ type:"connect", via:"usb" });
}
async function disconnectSerial(){
  keepReadingSerial=false;
  try{ if(reader){ await reader.cancel(); reader.releaseLock(); } }catch{}
  try{ if(port){ await port.close(); } }catch{}
  port=null; reader=null; usbBtn.textContent="USB 連線"; setStatus("未連線","");
  uploadLog({ type:"disconnect", via:"usb" });
}
async function serialLoop(){
  const dec=new TextDecoderStream(); port.readable.pipeTo(dec.writable).catch(()=>{});
  reader=dec.readable.getReader(); let buf="";
  while(keepReadingSerial){ let r; try{ r=await reader.read(); }catch{ break; } if(r.done) break;
    buf+=r.value; let i;
    while((i=buf.indexOf("\n"))>=0){ const ln=buf.slice(0,i).trim(); buf=buf.slice(i+1); onFFTLine(ln); } }
}

// ---- 藍芽 (Web Bluetooth, Nordic UART Service) ----
const NUS_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_TX      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // 裝置->手機 notify
let bleDevice=null, bleChar=null, bleBuf="";
async function connectBLE(){
  if(bleDevice){ await disconnectBLE(); return; }
  if(!("bluetooth" in navigator)){ setStatus("此瀏覽器不支援藍芽，Android 請用 Chrome","warn"); return; }
  try{
    bleDevice = await navigator.bluetooth.requestDevice({
      filters:[{ name:"SmartInhaler" }, { services:[NUS_SERVICE] }],
      optionalServices:[NUS_SERVICE],
    });
    bleDevice.addEventListener("gattserverdisconnected", onBLEDrop);
    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(NUS_SERVICE);
    bleChar = await service.getCharacteristic(NUS_TX);
    await bleChar.startNotifications();
    bleChar.addEventListener("characteristicvaluechanged", onBLEData);
    bleBtn.textContent="藍芽斷線"; setStatus("藍芽已連線","on");
    uploadLog({ type:"connect", via:"ble" });
  }catch(err){
    console.warn("BLE 連線失敗:", err);
    setStatus("藍芽未連線 / 已取消","warn"); bleDevice=null; bleChar=null;
  }
}
function onBLEData(e){
  const dec = new TextDecoder();
  bleBuf += dec.decode(e.target.value);
  let i;
  while((i=bleBuf.indexOf("\n"))>=0){ const ln=bleBuf.slice(0,i).trim(); bleBuf=bleBuf.slice(i+1); onFFTLine(ln); }
}
function onBLEDrop(){ setStatus("藍芽已斷線","warn"); bleBtn.textContent="藍芽連線"; bleDevice=null; bleChar=null;
  uploadLog({ type:"disconnect", via:"ble" }); }
async function disconnectBLE(){
  try{ if(bleChar) await bleChar.stopNotifications(); }catch{}
  try{ if(bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect(); }catch{}
  bleDevice=null; bleChar=null; bleBtn.textContent="藍芽連線"; setStatus("未連線","");
}

// ---- 觸控 / 鍵盤試玩 ----
let upDown=false, dnDown=false, upFlow=0, dnFlow=0;
addEventListener("keydown", e=>{ if(e.key==="ArrowUp"){upDown=true;e.preventDefault();}
  if(e.key==="ArrowDown"){dnDown=true;e.preventDefault();}
  if(e.code==="Space"){ onPrimary(); e.preventDefault(); } });
addEventListener("keyup", e=>{ if(e.key==="ArrowUp")upDown=false; if(e.key==="ArrowDown")dnDown=false; });

function bindHold(el, setter){
  const on=(e)=>{ e.preventDefault(); setter(true); };
  const off=(e)=>{ e.preventDefault(); setter(false); };
  el.addEventListener("touchstart",on,{passive:false}); el.addEventListener("touchend",off,{passive:false});
  el.addEventListener("touchcancel",off,{passive:false});
  el.addEventListener("mousedown",on); el.addEventListener("mouseup",off); el.addEventListener("mouseleave",off);
}

// ---------- 取樣即時輸入 ----------
const EXHALE_BIAS_WINDOW = 0.4;
let exhaleBiasBuffer = [];
function sample(now, dt){
  const RAMP=240, DECAY=420, KMAX=150;
  upFlow = upDown ? Math.min(KMAX,upFlow+RAMP*dt) : Math.max(0,upFlow-DECAY*dt);
  dnFlow = dnDown ? Math.min(KMAX,dnFlow+RAMP*dt) : Math.max(0,dnFlow-DECAY*dt);
  let flow=0, direction=null;
  if(upFlow>1 || dnFlow>1){
    if(upFlow>=dnFlow){ flow=upFlow; direction="inhalation"; }
    else { flow=dnFlow; direction="exhalation"; }
  } else if(now-lastTs<0.3 && lastFFT){
    const a=analyze(lastFFT);
    if(a.active){
      flow=a.flow; direction=a.direction;
      if(current===GAMES.balloon){
        if(direction==="exhalation") exhaleBiasBuffer.push({t:now});
        exhaleBiasBuffer = exhaleBiasBuffer.filter(b=> now-b.t <= EXHALE_BIAS_WINDOW);
        if(exhaleBiasBuffer.length>0) direction="exhalation";
      }
    } else { exhaleBiasBuffer=[]; }
  } else { exhaleBiasBuffer=[]; }
  const active = flow>=ONSET;
  const signed = direction==="inhalation"? flow : direction==="exhalation"? -flow : 0;
  return { flow, direction, active, signed, now, dt };
}

// ---------- 繪圖 helper ----------
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
function resize(){ const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener("resize", resize);
const g = {
  ctx, colors: COLORS,
  clear(c){ ctx.fillStyle=c||COLORS.bg; ctx.fillRect(0,0,cv.clientWidth,cv.clientHeight); },
  rrect(x1,y1,x2,y2,r){ r=Math.min(r,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2); ctx.beginPath();
    ctx.moveTo(x1+r,y1); ctx.arcTo(x2,y1,x2,y2,r); ctx.arcTo(x2,y2,x1,y2,r);
    ctx.arcTo(x1,y2,x1,y1,r); ctx.arcTo(x1,y1,x2,y1,r); ctx.closePath(); },
  fill(c){ ctx.fillStyle=c; ctx.fill(); }, stroke(c,w){ ctx.strokeStyle=c; ctx.lineWidth=w||2; ctx.stroke(); },
  text(t,x,y,size,c,align="center",bold=true){ ctx.fillStyle=c; ctx.textAlign=align; ctx.textBaseline="middle";
    ctx.font=`${bold?"bold ":""}${size}px "Microsoft JhengHei UI","Noto Sans TC",sans-serif`; ctx.fillText(t,x,y); },
  line(x1,y1,x2,y2,c,w,dash){ ctx.strokeStyle=c; ctx.lineWidth=w||2; ctx.setLineDash(dash||[]);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.setLineDash([]); },
  circle(x,y,r,c,fill=true){ ctx.beginPath(); ctx.arc(x,y,r,0,6.283);
    if(fill){ ctx.fillStyle=c; ctx.fill(); } else { ctx.strokeStyle=c; ctx.lineWidth=2; ctx.stroke(); } },
};

// ---------- API 給遊戲 ----------
const api = { colors:COLORS, store, ONSET,
  name(){ return (nameEl.value.trim()||"使用者"); },
  back(){ toHub(); },
};

// ---------- 遊戲切換 ----------
let current=null, currentId=null;
function startGame(id){
  current = GAMES[id]; if(!current) return;
  currentId = id;
  hub.style.display="none"; bottom.classList.remove("hide");
  touchpad.classList.add("show");
  if(current.reset) current.reset(api);
  primary.textContent = current.primaryLabel? (current.primaryLabel()||"") : "";
  primary.style.display = primary.textContent? "" : "none";
  resize();
  segActive=false; segSamples=[];
  uploadLog({ type:"game_start", game:id });
}
function toHub(){ current=null; currentId=null; hub.style.display="flex"; bottom.classList.add("hide");
  touchpad.classList.remove("show"); segActive=false; segSamples=[]; }
function onPrimary(){ if(current && current.primary){ current.primary(api);
  if(current.primaryLabel){ const t=current.primaryLabel()||""; primary.textContent=t;
    primary.style.display=t?"":"none"; } } }

// ---------- 波形紀錄 ----------
const SEG_MIN_DURATION = 0.15;
const SEG_MAX_POINTS = 150;
let segActive=false, segStart=0, segSamples=[];
function downsample(arr, maxPoints){
  if(arr.length<=maxPoints) return arr;
  const stride = arr.length/maxPoints; const out=[];
  for(let i=0;i<maxPoints;i++) out.push(arr[Math.floor(i*stride)]);
  return out;
}
function handleSegment(input){
  if(!current){ segActive=false; segSamples=[]; return; }
  if(input.active){
    if(!segActive){ segActive=true; segStart=input.now; segSamples=[]; }
    segSamples.push({ t:+(input.now-segStart).toFixed(2), f:Math.round(input.flow),
      d:input.direction==="inhalation"?1:input.direction==="exhalation"?-1:0 });
  } else if(segActive){
    segActive=false;
    const duration = input.now - segStart;
    if(duration>=SEG_MIN_DURATION && segSamples.length>0){
      uploadLog({ type:"attempt", game:currentId, duration:+duration.toFixed(2),
        series: downsample(segSamples, SEG_MAX_POINTS) });
    }
    segSamples=[];
  }
}

// ---------- 主迴圈 ----------
let last=performance.now()/1000;
function loop(){
  const now=performance.now()/1000; let dt=Math.min(now-last,0.1); last=now;
  const input=sample(now,dt);
  handleSegment(input);
  const w=cv.clientWidth, h=cv.clientHeight;
  if(current){
    if(current.update) current.update(dt,input,api);
    g.clear(COLORS.bg);
    if(current.render) current.render(g,w,h,api);
    if(current.primaryLabel){ const t=current.primaryLabel()||"";
      if(primary.textContent!==t){ primary.textContent=t; primary.style.display=t?"":"none"; } }
  }
  requestAnimationFrame(loop);
}

// ---------- 綁定 ----------
const bleBtn=document.getElementById("bleBtn");
const usbBtn=document.getElementById("usbBtn");
const statusEl=document.getElementById("status");
const syncStatusEl=document.getElementById("syncStatus");
const nameEl=document.getElementById("name");
const primary=document.getElementById("primary");
const hub=document.getElementById("hub");
const bottom=document.getElementById("bottom");
const touchpad=document.getElementById("touchpad");
function setStatus(t,cls=""){ statusEl.textContent="● "+t; statusEl.className=cls; }
bleBtn.onclick=connectBLE;
usbBtn.onclick=connectSerial;
document.getElementById("backBtn").onclick=toHub;
primary.onclick=onPrimary;
document.querySelectorAll(".card").forEach(c=> c.onclick=()=>startGame(c.dataset.game));
bindHold(document.getElementById("tInhale"), v=>upDown=v);
bindHold(document.getElementById("tExhale"), v=>dnDown=v);
nameEl.value = store.get("name","")||"";
nameEl.onchange=()=> store.set("name", nameEl.value.trim());

// 手機沒有 Web Serial 時，隱藏 USB 按鈕，主推藍芽
if(!("serial" in navigator)) usbBtn.style.display="none";
setStatus(`未連線 · ${algoStatus()}`,"");

resize(); loop();
</script>
</body>
</html>
